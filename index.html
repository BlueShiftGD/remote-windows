<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Пульт для ПК</title>
<style>
:root {
  color-scheme: dark;
  --bg: #16181d; --panel: #1f2229; --key: #2c313b; --line: #3a404c;
  --text: #ece9e2; --dim: #9aa0ab; --accent: #f2a93b; --danger: #e5484d;
  --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
body.amoled { --bg: #000; --panel: #0c0d10; --key: #1a1c22; --line: #2a2d35; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; display: flex; flex-direction: column; overflow: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* верхняя панель */
header { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
#tabs { display: flex; flex: 1; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; color: var(--dim); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 700; }
.icon-btn { background: none; border: 0; width: 40px; height: 40px; border-radius: 10px; font-size: 20px; color: var(--dim); display: grid; place-items: center; }
.icon-btn.on { color: var(--accent); background: #f2a93b22; }
#status { font-size: 13px; display: flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--dim); padding: 0 6px; height: 40px; }
#status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
#status.ok::before { background: #46a758; box-shadow: 0 0 8px #46a758; }

#editbar { display: none; gap: 8px; padding: 8px; background: #f2a93b14; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
body.editing #editbar { display: flex; }
#editbar input[type=text] { flex: 1; min-width: 120px; }
.field, #editbar input[type=text], dialog input, dialog select, dialog textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; user-select: text; -webkit-user-select: text; }
.chip { background: var(--key); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
.chip.danger { color: var(--danger); }

main { flex: 1; min-height: 0; position: relative; }

/* пульт */
.grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); grid-auto-rows: minmax(96px, 1fr); gap: 10px; padding: 12px; height: 100%; overflow-y: auto; align-content: start; }
.key { position: relative; overflow: hidden; background: color-mix(in srgb, var(--c, var(--key)) 85%, #000); border: 1px solid color-mix(in srgb, var(--c, var(--key)) 60%, #fff 20%); border-radius: 18px; box-shadow: 0 4px 0 rgba(0, 0, 0, .5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center; transition: transform .06s, box-shadow .06s; touch-action: manipulation; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .5); }
.key .ico { font-size: 30px; line-height: 1; }
.key .lbl { font-size: 14px; font-weight: 700; line-height: 1.15; word-break: break-word; }
.key.hold::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: #fff; opacity: .9; }
.key.holding::after { width: 100%; transition: width .7s linear; }
.key.fired { animation: fired .35s; }
@keyframes fired { 50% { filter: brightness(1.6); } }
body.editing .key { outline: 2px dashed var(--accent); outline-offset: -5px; }
.key.add { background: none; border: 2px dashed var(--line); box-shadow: none; color: var(--dim); }

/* геймпад */
.pad { height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 10px 16px; align-items: center; touch-action: none; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: space-around; height: 100%; gap: 8px; }
.pbtn { background: var(--key); border: 2px solid var(--line); border-radius: 14px; font-weight: 700; display: grid; place-items: center; touch-action: none; min-width: 64px; min-height: 40px; padding: 0 14px; }
.pbtn.down { background: var(--accent); color: #000; border-color: #fff; }
.shoulders { display: flex; gap: 12px; }
.dpad { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(3, var(--cell)); --cell: clamp(34px, 11dvh, 56px); }
.dpad .pbtn { min-width: 0; min-height: 0; padding: 0; border-radius: 10px; }
.abxy { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(3, var(--cell)); --cell: clamp(34px, 11dvh, 56px); }
.abxy .pbtn { min-width: 0; min-height: 0; padding: 0; border-radius: 50%; font-size: 20px; }
.stick { --s: clamp(80px, 24dvh, 140px); width: var(--s); height: var(--s); border-radius: 50%; background: var(--panel); border: 2px solid var(--line); position: relative; touch-action: none; }
.stick .knob { position: absolute; inset: 28%; border-radius: 50%; background: var(--key); border: 2px solid var(--accent); }
.stick.small { --s: clamp(64px, 20dvh, 100px); }
.center { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.rotate { display: none; position: absolute; inset: 0; background: var(--bg); place-items: center; text-align: center; color: var(--dim); padding: 30px; z-index: 5; }
@media (orientation: portrait) { .pad-wrap .rotate { display: grid; } }

/* тачпад */
.tp { height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.touchpad { flex: 1; border-radius: 20px; background: var(--panel); border: 2px solid var(--line); display: grid; place-items: center; color: var(--dim); text-align: center; padding: 20px; touch-action: none; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.row .key { min-height: 56px; border-radius: 14px; }

/* окна */
dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; color: var(--text); width: min(92vw, 460px); max-height: 88dvh; padding: 18px; }
dialog::backdrop { background: #000a; }
dialog h2 { margin: 0 0 12px; font-size: 20px; }
dialog label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 4px; }
dialog .actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
dialog .primary { background: var(--accent); color: #000; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; }
dialog .ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
dialog .hint { font-size: 13px; color: var(--dim); margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches { display: flex; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
.sw[aria-pressed="true"] { border-color: #fff; }
.choice { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--key); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 8px; }
.choice b { display: block; }
.choice span:last-child { color: var(--dim); font-size: 13px; }
.choice .big { font-size: 28px; }
.map { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: center; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #000d; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 88vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<script src="script.js" defer></script>
</head>
<body>
<header>
  <div id="tabs" role="tablist" aria-label="Страницы"></div>
  <button class="icon-btn" id="addPage" aria-label="Новая страница">＋</button>
  <button class="icon-btn" id="editToggle" aria-label="Режим редактирования">✎</button>
  <button class="icon-btn" id="settings" aria-label="Настройки">⚙</button>
  <button id="status" aria-label="Состояние связи с ПК">ПК</button>
</header>
<div id="editbar"></div>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
</body>
</html>
